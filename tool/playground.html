<div>
  <canvas id="myChart"></canvas>
</div>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,300..800;1,300..800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  const ctx = document.getElementById('myChart');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['vanilla', 'chocolate', 'strawberry'], 
      datasets: [{
        label: '# of favorite ice cream flavors',
        data: [10, 9, 8]
      }]
    }, 
    options: {
 
      animation: {
        duration: 1800,          
        easing: 'easeOutBounce'  
      },
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>
